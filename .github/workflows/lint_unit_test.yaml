name: Lint and Unit Test

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  Lint-Unit-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          cd app
          npm install
          npm run lint
      - name: Unit Test
        run: |
          cd app
          npm install
          npm run test